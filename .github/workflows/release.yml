name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Verify annotated tag and version metadata
        shell: bash
        run: |
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "$GITHUB_REF_NAME must be an annotated tag" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "tag target does not match checked-out release commit" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          package_version="$(
            uv run python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          [[ "$package_version" == "$version" ]]
          grep -Fx "version: $version" CITATION.cff
          grep -F "## [$version] -" CHANGELOG.md

      - name: Ruff format check
        run: make fmt-check

      - name: Ruff lint
        run: make lint

      - name: Generate browser Python bundle
        run: make stage-web

      - name: Verify frozen golden baseline
        run: make golden-check

      - name: Run non-browser tests
        run: uv run pytest -q -m "not e2e"

      - name: Install Chromium and WebKit
        run: uv run playwright install --with-deps chromium webkit

      - name: Run full Chromium browser suite
        run: |
          uv run pytest -q -m e2e \
            --browser chromium \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results/chromium

      - name: Run WebKit initial-render smoke test
        run: |
          uv run pytest -q \
            tests/e2e/test_initial_and_inputs.py::test_initial_render_loads_pyodide_and_plots \
            --browser webkit \
            --tracing retain-on-failure \
            --video retain-on-failure \
            --screenshot only-on-failure \
            --output test-results/webkit

      - name: Verify generated staging leaves tracked state clean
        shell: bash
        run: |
          test -f web/assets/py/manifest.json
          git diff --check
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short --untracked-files=all
            exit 1
          fi

      - name: Build deterministic release bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="$RUNNER_TEMP/release-bundle"
          first="$RUNNER_TEMP/source-a.tar.gz"
          second="$RUNNER_TEMP/source-b.tar.gz"
          mkdir -p "$bundle"

          git archive \
            --format=tar \
            --prefix="conf_curve_likelihood-$version/" \
            "refs/tags/$GITHUB_REF_NAME" | gzip -n > "$first"
          git archive \
            --format=tar \
            --prefix="conf_curve_likelihood-$version/" \
            "refs/tags/$GITHUB_REF_NAME" | gzip -n > "$second"
          cmp "$first" "$second"

          source_name="conf_curve_likelihood-$version.tar.gz"
          cp "$first" "$bundle/$source_name"
          cp web/assets/py/manifest.json "$bundle/browser-stage-manifest.json"
          (
            cd "$bundle"
            sha256sum "$source_name" browser-stage-manifest.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]:/ { exit }
            capture { print }
          ' CHANGELOG.md > "$bundle/release-notes.md"
          test -s "$bundle/release-notes.md"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-bundle
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 14

  release:
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: verified-release-bundle
          path: release-bundle

      - name: Verify downloaded checksums
        shell: bash
        run: |
          (
            cd release-bundle
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub prerelease from verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-bundle/conf_curve_likelihood-$version.tar.gz" \
            release-bundle/browser-stage-manifest.json \
            release-bundle/SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Wald Confidence Curve Explorer $version" \
            --notes-file release-bundle/release-notes.md
