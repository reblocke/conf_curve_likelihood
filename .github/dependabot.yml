version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Preserve the released Core/scientific compatibility ceilings in pyproject.toml.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.3"]
      - dependency-name: "scipy"
        versions: [">=1.15"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
